<script>

/**
 * Módulo:    graficos_js.html
 * Objetivo:  Módulo com funções que obtêm os dados quantitativos e gera seus gráficos
 */

  "use strict";  

  // Arrays para armazenar os valores X e Y do gráfico Situação do Benefício
  let quantitativoSituacaoBeneficio;
  let labelSituacaoBeneficio;

  // Arrays para armazenar os valores X e Y do gráfico Situação da Vistoria
  let quantitativoSituacaoVistoria;
  let labelSituacaoVistoria;

  // Arrays para armazenar os valores X e Y do gráfico Perfis
  let quantitativoPerfis;
  let labelPerfis;

  // Arrays para armazenar os valores X e Y do gráfico de Identidades de Gênero
  let quantitativoIdentidadeGenero;
  let labelIdentidadeGenero;  

  // Arrays para armazenar os valores X e Y do gráfico de Orientações Sexuais
  let quantitativoOrientacaoSexual;
  let labelOrientacaoSexual;  

  // Flags
  let flagLabelsInicializados = false;
  let flagDadosContabilizados = false;


  /**
   * Função que gera inicializa os labels dos gráficos
   */
  async function inicializarLabels() {

    flagLabelsInicializados = false;

    // Aguarda carregamento das tabelas na cache de tabelas
    while( !tabelasCarregadasNaCache() ) {      
      await esperar( 1000 );
    }            

    // Inicializa os labels
    inicializarLabelsSituacaoBeneficio();
    inicializarLabelsSituacaoVistoria();
    inicializarLabelsPerfis();
    inicializarLabelsIdentidadeGenero();
    inicializarLabelsOrientacaoSexual();

    flagLabelsInicializados = true;

  } // Fim da função inicializarLabels

  

  /**
   * Função que gera os quantitativos
   */
  async function contabilizarDados() {
  
    flagDadosContabilizados = false;

    // Aguarda carregamento das tabelas na cache de tabelas
    while( !tabelasCarregadasNaCache() ) {      
      await esperar( 1000 );
    }            

    // Inicializa os contadores
    quantitativoSituacaoBeneficio = new Array( numSituacoesBeneficio ).fill( 0 );        
    quantitativoSituacaoVistoria = new Array( numSituacoesVistoria + 1 ).fill( 0 );    
    quantitativoPerfis = new Array( numPerfis ).fill( 0 );
    quantitativoIdentidadeGenero = new Array( numIdentidadesDeGenero ).fill( 0 );
    quantitativoOrientacaoSexual = new Array( numOrientacoesSexuais ).fill( 0 );

    // Contabiliza a quantidade de casos em cada situação
    casosFiltrados.forEach( caso => {   
      contabilizarSituacaoBeneficio( caso );
      contabilizarSituacaoVistoria( caso );
      contabilizarPerfis( caso );
      contabilizarIdentidadeGenero( caso );
      contabilizarOrientacaoSexual( caso )
    });    
  
    flagDadosContabilizados = true;

  } // Fim da função contabilizarDados



  /**
   * Função que gera os gráficos
   */
  async function gerarGraficos() {

    // Aguarda contabilização do dados
    while( !flagDadosContabilizados || !flagLabelsInicializados ) {      
      await esperar( 1000 );
    }                

    gerarGraficoSituacaoBeneficio();
    gerarGraficoSituacaoVistoria();
    gerarGraficoPerfis();
    gerarGraficoIdentidadeGenero();
    gerarGraficoOrientacaoSexual();

  } // Fim da função gerarGraficos



// #############  SITUAÇÃO DO BENEFÍCIO  #############


  /**
   * Função que inicializa os labels do gráfico Situação do Benefício
   */
  function inicializarLabelsSituacaoBeneficio() {

    labelSituacaoBeneficio = [];
    cache_TabelaSituacoesBeneficio.forEach( sit_beneficio => {
      labelSituacaoBeneficio.push( sit_beneficio[COLUNA_NOME] );  
    });

  } // Fim da função inicializarLabelsSituacaoBeneficio


  /**
   * Função que contabiliza a quantidade de cada situação (Situação do Benefício) do caso
   */
  function contabilizarSituacaoBeneficio( caso ) {

    ++(quantitativoSituacaoBeneficio[ parseInt(caso.id_situacao_beneficio) - 1 ]);

  } // Fim da função contabilizarSituacaoBeneficio


  /**
   * Função que gera o gráfico de barras da quantidade de casos em cada situação (Situação do Benefício)
   */
  function gerarGraficoSituacaoBeneficio() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoSituacaoBeneficio" );    
    
    const data = [{
      x:labelSituacaoBeneficio,
      y:quantitativoSituacaoBeneficio,
      type:"bar",      
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoSituacaoBeneficio.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Situações Benefícios</b>" },            
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoSituacaoBeneficio 
  


// #############  SITUAÇÃO DA VISTORIA  #############


  /**
   * Função que inicializa os labels do gráfico Situação da Vistoria
   */
  function inicializarLabelsSituacaoVistoria() {

    labelSituacaoVistoria = [];
    cache_TabelaSituacoesVistoria.forEach( sit_vistoria => {
      labelSituacaoVistoria.push( sit_vistoria[COLUNA_NOME] );  
    });
    labelSituacaoVistoria.push( "SEM VISTORIA AGENDADA" );

  } // Fim da função inicializarLabelsSituacaoVistoria


  /**
   * Função que contabiliza a quantidade de casos em cada situação (Situação da Vistoria)
   */
  function contabilizarSituacaoVistoria( caso ) {

    if( caso.id_situacao_vistoria != "" ) {
      ++(quantitativoSituacaoVistoria[ parseInt(caso.id_situacao_vistoria) - 1 ]);
    } else {
      ++(quantitativoSituacaoVistoria[ quantitativoSituacaoVistoria.length - 1 ]);
    }        

  } // Fim da função contabilizarSituacaoVistoria


  /**
   * Função que gera o gráfico de barras da quantidade de casos em cada situação (Situação da Vistoria)
   */
  function gerarGraficoSituacaoVistoria() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoSituacaoVistoria" );    
    
    const data = [{
      x:labelSituacaoVistoria,
      y:quantitativoSituacaoVistoria,
      type:"bar",      
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoSituacaoVistoria.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Situações Vistorias</b>" },      
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoQuantitativoSituacaoVistoria 
  


// #############  PERFIL  #############


  /**
   * Função que inicializa os labels do gráfico Perfis
   */
  function inicializarLabelsPerfis() {

    labelPerfis = [];
    cache_TabelaPerfis.forEach( perfil => {
      labelPerfis.push( perfil[COLUNA_NOME] );  
    });

  } // Fim da função inicializarLabelsPerfis


  /**
   * Função que contabiliza a quantidade de características do caso
   */
  function contabilizarPerfis( caso) {

    let perfilCaso = caso.ids_perfil.split(";");

    for( let i=0; i<numPerfis; ++i)  {
      quantitativoPerfis[i] += parseInt( perfilCaso[i] );
    }

  } // Fim da função contabilizarPerfis


  /**
   * Função que gera o gráfico de barras da quantidade características dos casos
   */
  function gerarGraficoPerfis() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoPerfis" );    

    const quantitativoPerfisReversed = quantitativoPerfis.toReversed();
    const labelPerfisReversed = labelPerfis.toReversed();
    
    const data = [{
      x:quantitativoPerfisReversed,
      y:labelPerfisReversed,      
      type:"bar",      
      textposition: 'auto',
      orientation:"h",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoPerfisReversed.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Perfil dos Cidadãos</b>" },            
      height: 900, // Altura total  
      width: 1200, // Largura total
      xaxis: {
        automargin: true
      },      
      yaxis: {
//        tickangle: -45,        
        automargin: true
      }
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoPerfis 
  


// #############  GÊNERO  #############


  /**
   * Função que inicializa os labels do gráfico Identidade de Gênero
   */

    labelIdentidadeGenero = [];
    cache_TabelaIdentidadesDeGenero.forEach( genero => {
      labelIdentidadeGenero.push( genero[COLUNA_NOME] );  
    });

  } // Fim da função inicializarLabelsIdentidadeGenero


  /**
   * Função que contabiliza a quantidade de identidades de gênero do caso
   */

  } // Fim da função contabilizarIdentidadeGenero


  /**
   * Função que gera o gráfico de barras da quantidade de identidades de gênero dos casos
   */

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoPerfisIdentidadeGenero" );    
    
    const data = [{
      x:labelIdentidadeGenero,

      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoIdentidadeGenero.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Identidades de Gênero dos Cidadãos</b>" },            
      height: 500, // Altura total  
      xaxis: {
        automargin: true
      },      
      yaxis: {
        tickangle: -45,        
        automargin: true
      }
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoIdentidadeGenero 
  


// #############  ORIENTAÇÃO SEXUAL  #############


  /**
   * Função que inicializa os labels do gráfico Orientações Sexuais
   */

    labelOrientacaoSexual = [];
    cache_TabelaOrientacoesSexuais.forEach( orientacaoSexual => {
      labelOrientacaoSexual.push( orientacaoSexual[COLUNA_NOME] );

  } // Fim da função inicializarLabelsOrientacaoSexual


  /**
   * Função que contabiliza a quantidade de orientações sexuais do caso

    const layout = {

      height: 500, // Altura total

        automargin: true
      },

      }
    };

    const config = {

    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoOrientacaoSexual 


</script>
