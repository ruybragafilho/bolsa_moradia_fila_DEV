  "use strict";
  
  /**
   * Função frontend que altera a data limite do caso  
   */  
  function adicionarServicoReferenciaAtivoParaUmCasoFE() {

    console.log( "adicionarServicoReferenciaAtivoParaUmCasoFE_js - INÍCIO" );


    const idServicoReferencia = document.getElementById("select_adicionarServicoReferencia").value;         
    console.log( "Id Serviço Referência: " + idServicoReferencia );


    if( !idServicoReferencia ) {

      // Exibe modal de erro caso o serviço de referência não tenha sido selecionado
      mostrarModalErro( "O campo Serviço de Referência é obrigatório!" );                            

    } else {

      // Se serviço de referência tiver sido informado, prossegue 

      // mostra modal com mensagem de evolução de caso
      mostrarModalMensagem( "Registrando novo serviço de referência, por favor aguarde..." );


      // Construindo o objeto com o novo serviço de referência que será adicionado
      const obj_relacionamentoServicoCaso = {
        idCaso: id_CasoEmVisualizacao,
        idServicoReferencia: idServicoReferencia,
        idResponsavelInformacao: usuarioLogado.id
      };
   
      const json_relacionamentoServicoCaso = JSON.stringify( obj_relacionamentoServicoCaso );
            

      // Chama a função back end para evoluir multiplos casos          
      google.script.run
                   .withSuccessHandler( () => {

                     // Adiciona o novo serviço de referência no frontend
                     const dataInformacao = new Date();

                     const novoServicoReferencia = {         
                       idServico: idServicoReferencia,
                       dataInformacao: dataInformacao.toLocaleString("pt-BR", {dateStyle: "short"}),
                       idResponsavelInformacao: usuarioLogado.id, 
                       emailResponsavelInformacao: usuarioLogado.email
                     }                      
                     
                     cache_CasoEmVisualizacao.servicos_referencia.unshift( novoServicoReferencia );
  
                     cache_CasoEmVisualizacao.servico_referencia_ativo = novoServicoReferencia;

                     // Visualiza novo serviço de referência
                     visualizarServicosReferencia( cache_CasoEmVisualizacao );
  
                     // Esconde modal de mensagem
                     modalMensagem.hide();      
                     window.scrollTo(0, 0);    
  
                   })
                   .withFailureHandler( erro => {
  
                     // mostra modal com mensagem de erro
                     mostrarModalErro( "adicionarServicoReferenciaAtivoParaUmCasoFE_js - " + erro.message );
                     redirecionarParaTelaResumosDosCasos( 0 );
  
                   })
                   // Chama a função backend que registra novo serviço de referência ativo para o caso
                   .adicionarServicoReferenciaAtivoParaUmCasoBE( json_relacionamentoServicoCaso );
